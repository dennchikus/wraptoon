[project]
name = "service-oriented-systems"
version = "2.3.0"
description = "Веб-сервис студии автодетейлинга и стайлинга WRAP TOON"
readme = "README.md"
authors = [
    { name = "jokesss43", email = "kkk-lll-1995@inbox.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "socksio>=1.0.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.52.4",
]

[project.scripts]
service-oriented-systems = "service_oriented_systems:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
]
